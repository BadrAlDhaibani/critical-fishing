<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Critical Fishing</title>
    <style>
      /* The canvas is scaled by a whole number and centred, so whatever is left
         over is letterbox. Black, so it reads as deliberate. */
      html,
      body {
        height: 100%;
        margin: 0;
        background: #000;
        overflow: hidden;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
      }
      /* Debug readout. Deliberately outside the canvas so it renders at native
         resolution and stays sharp at any zoom. See game/render/debugOverlay.

         Bottom left rather than top left since task 1.5: the hull and line bars
         are game objects in the sky at the canvas's top left, and debug chrome
         does not get to sit on top of the UI it is there to help tune. */
      #debug {
        position: fixed;
        bottom: 8px;
        left: 8px;
        margin: 0;
        font:
          12px/1.4 ui-monospace,
          monospace;
        color: #fff;
        text-shadow: 0 1px 2px #000;
        white-space: pre;
        pointer-events: none;
        user-select: none;
      }
      /* Cue audition buttons for the task 2.5 tuning pass. See
         game/audio/audition.

         Bottom right, opposite the readout, because both are debug chrome and
         neither should cover the other. This one is the exception to the
         pointer-events rule above: it is the only chrome that is clicked rather
         than read. */
      #audition {
        position: fixed;
        bottom: 8px;
        right: 8px;
        display: flex;
        gap: 4px;
      }
      /* Fish picker for the task 3.3 playtest. See game/scenes/fishPicker.

         Stacked directly above the audition row rather than beside it: both are
         clickable debug chrome and the bottom right corner is where that lives,
         but a single row of seven buttons would start creeping across the
         letterbox. */
      #fish-picker {
        position: fixed;
        bottom: 38px;
        right: 8px;
        display: flex;
        gap: 4px;
      }
      #audition button,
      #fish-picker button {
        font:
          12px/1.4 ui-monospace,
          monospace;
        color: #fff;
        background: #222;
        border: 1px solid #555;
        padding: 2px 8px;
        cursor: pointer;
      }
      /* The fish every cast is pinned to, when one is. Brightened rather than
         dimmed: it is the one piece of information this panel carries beyond its
         own labels, and a greyed-out button would read as unavailable instead.
         Nothing is marked while casts are rolling. */
      #fish-picker button.current {
        color: #000;
        background: #d8cfc0;
        border-color: #d8cfc0;
      }
      /* The cast prompt, and the fish a cast hooked. See game/render/castPrompt.

         The one piece of *game* UI outside the canvas, and a placeholder: it is
         text, and canvas text cannot be sharp under nearest-neighbour upscaling
         until there is a bitmap font at phase 8.1. Centred over the whole window
         rather than over the canvas, which is itself centred and letterboxed, so
         the two agree at every zoom without either knowing the other's size.

         Low in the window rather than in the middle of it: the fight happens
         under the waterline and the bars sit in the sky, so this is the one band
         of screen nothing else is using. */
      #cast-prompt {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 18%;
        margin: 0;
        text-align: center;
        font:
          16px/1.4 ui-monospace,
          monospace;
        letter-spacing: 0.1em;
        color: #fff;
        text-shadow: 0 2px 4px #000;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="cast-prompt"></div>
    <pre id="debug"></pre>
    <div id="fish-picker"></div>
    <div id="audition"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

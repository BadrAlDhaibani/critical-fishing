<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Critical Fishing</title>
    <style>
      /* The canvas is scaled by a whole number and centred, so whatever is left
         over is letterbox. Black, so it reads as deliberate. */
      html,
      body {
        height: 100%;
        margin: 0;
        background: #000;
        overflow: hidden;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
      }
      /* Debug readout. Deliberately outside the canvas so it renders at native
         resolution and stays sharp at any zoom. See game/render/debugOverlay. */
      #debug {
        position: fixed;
        top: 8px;
        left: 8px;
        margin: 0;
        font:
          12px/1.4 ui-monospace,
          monospace;
        color: #fff;
        text-shadow: 0 1px 2px #000;
        white-space: pre;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <pre id="debug"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
